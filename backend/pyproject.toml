[project]
name = "monoloop-backend"
version = "1.0.0"
description = "MONOLOOP FastAPI backend: supply, demand, explainable matching, exchanges and impact."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["E741", "S101", "B008", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"app/services/ai/extraction.py" = ["E501"]
